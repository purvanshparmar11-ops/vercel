<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>
<style>
body{
font-family: Arial, sans-serif;
}
form{
max-width: 500px;
margin: 50px auto;
}
input,
textarea{
width: 100%;
padding: 10px;
margin-bottom: 15px;
box-sizing: border-box;
}
button{
background: #28a745;
color: #fff;
border: none;
padding: 12px 25px;
cursor: pointer;
border-radius: 5px;
}
button:hover{
opacity: 0.9;
}
/* Popup */
.popup{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:9999;
}
.popup-content{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#fff;
padding:30px;
border-radius:10px;
text-align:center;
min-width:320px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}
.popup-content h3{
color:#28a745;
margin-bottom:10px;
}
.popup-content p{
margin-bottom:20px;
}
.popup-content button{
background:#28a745;
}
</style>
</head>
<body>
<form id="contactForm">
<label>Name</label>
<input type="text" name="name" required>
<label>Email</label>
<input type="email" name="email" required>
<label>Phone Number</label>
<input type="text" name="phone">
<label>Message</label>
<textarea name="message" rows="5"></textarea>
<button type="submit">Send Inquiry</button>
</form>
<!-- Success Popup -->
<div id="successPopup" class="popup">
<div class="popup-content">
<h3>Success!</h3>
<p>Inquiry Submitted Successfully.</p>
<button onclick="goHome()">OK</button>
</div>
</div>
<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
e.preventDefault();
const form = this;
fetch(
  
  
"https://script.google.com/macros/s/AKfycbyCnlYL0jDQGv0DudnBvvwAeX4mpkD9_ld_Pb_cx3ZR6HFr8lLp66uYDBxBauQh8zFu/exec",
{
method: "POST",
body: new FormData(form),
mode: "no-cors"
}
)
.then(() => {
document.getElementById("successPopup").style.display = "block";
})
.catch((error) => {
alert("Submission Failed!");
console.log(error);
});
});
function goHome() {
window.location.href = "https://purvanshparmar11-ops.github.io/vercel";
/* OR use your website home page:
window.location.href = "https://purvanshparmar11-ops.github.io/B";
*/
}
</script>
  
</body>
</html>
